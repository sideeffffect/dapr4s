name: CI
on:
  push:
  release:
    types: [ published ]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: VirtusLab/scala-cli-setup@v1
      with:
        power: true
    - name: Check formatting (scalafmt)
      run: |
        # `scala-cli fmt --check` reports a scalafmt parse error but still exits 0,
        # which would silently mask unformatted files (a parse error aborts the scan
        # early). Files using experimental capture-checking `^{...}` syntax that
        # scalafmt can't parse are listed in .scalafmt.conf project.excludeFilters;
        # if a new such file is added without excluding it, fail loudly here rather
        # than let the whole check pass blind.
        scala-cli fmt --check . 2>&1 | tee fmt.log
        if grep -qiE 'ParseError|illegal start of' fmt.log; then
          echo "::error::scalafmt hit a parse error — add the offending file to .scalafmt.conf project.excludeFilters"
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: VirtusLab/scala-cli-setup@v1
      with:
        power: true
    - name: Compile
      run: scala-cli compile .
    - name: Unit tests
      run: scala-cli test . --test-only 'dapr4s.test.unit.*'

  test-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: VirtusLab/scala-cli-setup@v1
      with:
        power: true
    # Scala.js invocations must exclude jvm-deps.scala (the Dapr Java SDK +
    # testcontainers) — scala-cli cannot scope dependency directives to a platform,
    # so that file is the wall keeping JVM-only artifacts out of the JS build.
    # The runner's default Node is fine: unit tests run on the plain JS backend
    # (the orphan-js.await capability code is Wasm-only and unit tests don't link
    # it), and no unit test loads @dapr/dapr, so no npm install is needed here.
    - name: Compile (Scala.js)
      run: scala-cli compile --js . --exclude jvm-deps.scala
    - name: Unit tests (Scala.js)
      run: scala-cli test --js . --exclude jvm-deps.scala

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: VirtusLab/scala-cli-setup@v1
      with:
        power: true
    # The integration suite spins up a real daprd sidecar (and Redis) per test via
    # testcontainers-dapr; Docker is preinstalled on ubuntu-latest. These are the
    # round-trip publish/subscribe + service-invocation tests — the coverage that
    # would have caught the JSON double-encoding regression that compile-only CI missed.
    - name: Integration tests
      run: scala-cli test . --test-only 'dapr4s.test.integration.*'

  publish:
    needs: [format, test, test-js, integration-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: VirtusLab/scala-cli-setup@v1
      with:
        power: true
    - name: Publish
      run: scala-cli publish .
      env:
        PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
        PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        PUBLISH_SECRET_KEY_PASSWORD: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
    # Second invocation publishes the Scala.js artifact (dapr4s_sjs1_3); excluding
    # jvm-deps.scala keeps the Dapr Java SDK out of its POM.
    - name: Publish (Scala.js)
      run: scala-cli publish --js . --exclude jvm-deps.scala
      env:
        PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
        PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        PUBLISH_SECRET_KEY_PASSWORD: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
