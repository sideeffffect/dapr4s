name: CI
on:
  push:
    branches: [main, master]
  release:
    types: [ published ]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 25
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v8
    - name: Check formatting (scalafmt)
      run: |
        # Files using experimental capture-checking `^{...}` syntax that scalafmt can't parse are
        # listed in .scalafmt.conf project.excludeFilters. If a new such file is added without
        # excluding it, fail loudly here with a pointer to the fix. (Unlike `scala-cli fmt --check`,
        # which exited 0 on a parse error, sbt-scalafmt fails the task; the grep turns that into an
        # actionable message and still guards against a tool version that only logs it.)
        set +e -o pipefail
        sbt -Dsbt.color=false scalafmtCheckAll scalafmtSbtCheck 2>&1 | tee fmt.log
        status=$?
        if grep -qiE 'ParseError|illegal start of|error: \[dialect' fmt.log; then
          echo "::error::scalafmt hit a parse error — add the offending file to .scalafmt.conf project.excludeFilters"
          exit 1
        fi
        exit $status

  # One matrix leg per platform. Adding Scala Native one day should be a new include entry
  # (platform: native, ...), not a new job. Each leg: compile, unit tests, integration tests.
  #
  #   core<P>         the library + its unit tests (test/{shared,<p>} minus integration/)
  #   integration<P>  the Docker-based integration suites (test/{shared,<p>}/integration)
  #
  # The `wasm` leg is the Phase-0 WASI-component prototype (docs/WASM-COMPONENTS-PROPOSAL.md §6). It
  # is a separate, opt-in sbt build in wasm/ (the scala-wasm fork of sbt-scalajs cannot share a
  # meta-build with mainline sbt-scalajs) and has its own steps below: format check, the wall's unit
  # tests (on Node) and scripts/wasm/e2e.sh in source mode, then publishLocal of the six wasm artifacts
  # and a plugin-only consumer build (scripts/wasm/consumer-check.sh).
  #
  # The wasm leg GATES `publish`, like jvm and js: the publish job also publishes the six wasm
  # artifacts to Central (PUBLISH_WASM_TO_CENTRAL), so a broken wasm build must never reach a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            project: JVM
          - platform: js
            project: JS
          - platform: wasm
            project: Wasm
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 25
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v8
    # Wasm 3.0 + JSPI are on by default from Node 25; the runner's default Node has neither.
    - name: Set up Node 25
      if: matrix.platform == 'js'
      uses: actions/setup-node@v4
      with:
        node-version: 25
    - name: Install npm dependencies (@dapr/dapr, testcontainers)
      if: matrix.platform == 'js'
      run: npm ci
    # The ScalablyTyped facades are generated from node_modules and compiled by the build
    # (stFacades, ~3 min cold). Cache the converter's parse cache and the compiled facades;
    # zinc recompiles anything the restored state does not cover, so a stale hit is only slower.
    - name: Cache ScalablyTyped facades
      if: matrix.platform == 'js'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          .st-facades/target
        key: st-facades-${{ hashFiles('package-lock.json', 'build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
    - name: Compile
      if: matrix.platform != 'wasm'
      run: sbt core${{ matrix.project }}/compile integration${{ matrix.project }}/Test/compile
    - name: Unit tests
      if: matrix.platform != 'wasm'
      run: sbt core${{ matrix.project }}/test
    - name: Integration tests
      if: matrix.platform != 'wasm'
      # A real daprd sidecar (+ Redis, placement, scheduler) via testcontainers; Docker is
      # preinstalled on ubuntu-latest. JVM: testcontainers-dapr. JS: @dapr/testcontainer-node,
      # started from inside the Wasm+JSPI test runtime.
      # Both legs normally finish in a few minutes; the timeout turns a hang into a failure instead of a 6h wait.
      timeout-minutes: 20
      run: sbt integration${{ matrix.project }}/test

    # ---- wasm leg (the opt-in wasm/ build) ----------------------------------------------------
    # Tool versions are the ones the Phase-0 spike used (wiki: scala-wasm-component-spike).
    - name: Install wasm tools (wasm-tools, wasmtime, wkg, wac)
      if: matrix.platform == 'wasm'
      env:
        WASM_TOOLS_VERSION: 1.261.0
        WASMTIME_VERSION: 49.0.2
        WKG_VERSION: 0.16.1
        WAC_VERSION: 0.10.0
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
        rel=https://github.com/bytecodealliance
        curl -fsSL "$rel/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
          | tar -xz -C /tmp
        mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$bin/"
        curl -fsSL "$rel/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
          | tar -xJ -C /tmp
        mv "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$bin/"
        curl -fsSL -o "$bin/wkg" "$rel/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu"
        curl -fsSL -o "$bin/wac" "$rel/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"
        chmod +x "$bin/wkg" "$bin/wac"
        "$bin/wasm-tools" --version; "$bin/wasmtime" --version; "$bin/wkg" --version; "$bin/wac" --version
    # The scala-wasm sbt plugin runs `wit-bindgen-scala` (crate 0.1.0) to generate the bindings.
    - name: Cache wit-bindgen-scala
      if: matrix.platform == 'wasm'
      id: cache-wbs
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wit-bindgen-scala
        key: wit-bindgen-scala-0.1.0-${{ runner.os }}
    - name: Install wit-bindgen-scala
      if: matrix.platform == 'wasm' && steps.cache-wbs.outputs.cache-hit != 'true'
      run: cargo install wit-bindgen-scala --version 0.1.0 --locked
    - name: Install the dapr CLI and daprd (slim, no placement/scheduler)
      if: matrix.platform == 'wasm'
      run: |
        wget -q https://raw.githubusercontent.com/dapr/cli/v1.15.1/install/install.sh -O - | /bin/bash -s 1.15.1
        dapr init --slim --runtime-version 1.17.7
        echo "$HOME/.dapr/bin" >> "$GITHUB_PATH"
    # The patched scala-wasm linker (scripts/wasm/build-patched-linker.sh: the 1.22.1-wasm.6 release
    # commit + our export-params patch, published to ~/.ivy2/local). Rebuilt only when the script, the
    # patch or the version in wasm/build.sbt changes.
    # The patched scala-wasm linker (scripts/wasm/build-patched-linker.sh: the 1.22.1-wasm.6 release commit +
    # our params-via-memory patch) is built by the `wasmLinker` project on demand; cache its output and the
    # scala-wasm clone. Rebuilt only when the script or the patch changes.
    - name: Cache the patched scala-wasm linker build
      if: matrix.platform == 'wasm'
      uses: actions/cache@v4
      with:
        path: |
          wasm/target/scala-wasm-linker
          ~/.cache/dapr4s/scala-wasm-src
        key: scala-wasm-linker-${{ hashFiles('scripts/wasm/build-patched-linker.sh', 'scripts/wasm/patches/**') }}
    # The UNRELEASED scala-java-time the wasm/ build pins (2.8.1-dapr4s-local: main + the open
    # https://github.com/cquiroz/scala-java-time/pull/618, tzdb compiled with a Scala 3 nightly; see
    # scripts/wasm/build-scala-java-time.sh). Built from source with a JDK 17 and publishLocal'ed; cached
    # by the script's hash (it pins the SHAs, the compilers and the version). Goes away with a
    # scala-java-time release that has both.
    # Both JDKs: the last one (25) stays the default; the script finds 17 through $JAVA_HOME_17_X64.
    - name: Install JDK 17 next to 25 (scala-java-time's build)
      if: matrix.platform == 'wasm'
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: |
          17
          25
    - name: Cache the scala-java-time source build
      if: matrix.platform == 'wasm'
      uses: actions/cache@v4
      with:
        path: ~/.ivy2/local/io.github.cquiroz
        key: scala-java-time-src-${{ hashFiles('scripts/wasm/build-scala-java-time.sh') }}
    - name: Build and publishLocal scala-java-time
      if: matrix.platform == 'wasm'
      run: scripts/wasm/build-scala-java-time.sh
    # Source mode: the wall over dapr4s's own src/shared (covers shared-code changes), unit tests + e2e
    # (counter-raw, counter, imports-probe against daprd + Redis).
    - name: Format check, wall unit tests (wasm/, source mode)
      if: matrix.platform == 'wasm'
      working-directory: wasm
      run: sbt scalafmtCheckAll scalafmtSbtCheck -Ddapr4s.wasm.core=source wallWasm/test
    - name: E2E, source mode (components + compose + daprd + Redis)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: SBT_ARGS=-Ddapr4s.wasm.core=source scripts/wasm/e2e.sh
    # Release mode (the default): the six artifacts as they would be published (the wall on the published
    # dapr4s_sjs1_3), publishLocal'ed, then a fresh consumer build that has nothing but the plugin + one
    # dependency builds test/wasm/counter and runs its e2e. dapr4s-examples consumes the same artifacts.
    - name: publishLocal (release mode)
      if: matrix.platform == 'wasm'
      working-directory: wasm
      run: sbt wallWasm/test publishLocal
    - name: Consumer check (plugin + one dependency, e2e)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: scripts/wasm/consumer-check.sh

  publish:
    needs: [format, test]
    if: github.event_name != 'pull_request'
    # Serialize publishes that would target the same artifact version. The version
    # is dynver-derived from git state at the commit, so every publish-triggering
    # event on one commit (master push, tag push, release:published) resolves to the
    # SAME version — and two such runs racing on Sonatype's bulk/promote is what made
    # the v1.0.0 tag-push run 400 ("Publish request failed") while the master-push run
    # for the same commit won. We can't key on the resolved version string itself:
    # concurrency.group is evaluated at queue time and can only see github/inputs/vars,
    # not runtime step outputs — and github.sha maps 1:1 to the dynver version anyway.
    # cancel-in-progress: false so an in-flight publish is never interrupted mid-promote
    # (which could leave a half-promoted staging repo); the duplicate simply waits.
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # The switch for Central publishing of the wasm artifacts (ON since 2026-10-13, approved by the
      # user). Setting it to 'false' stops only the wasm artifacts; core (dapr4s_3, dapr4s_sjs1_3)
      # publishes regardless.
      PUBLISH_WASM_TO_CENTRAL: 'true'
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 25
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v8
    # The Scala.js artifact embeds the ScalablyTyped facade .sjsir (see build.sbt), which the
    # build generates from node_modules.
    - name: Install npm dependencies
      run: npm ci
    - name: Cache ScalablyTyped facades
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          .st-facades/target
        key: st-facades-${{ hashFiles('package-lock.json', 'build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
    # Publishes dapr4s_3 and dapr4s_sjs1_3 (sbt-ci-release: a release tag publishes the clean
    # version, anything else a dynver -SNAPSHOT). The secrets keep their scala-cli era names;
    # sbt-ci-release wants PGP_SECRET as a base64-encoded ASCII-armored key, so accept either an
    # armored key or an already base64-encoded one.
    - name: Publish (JVM + Scala.js)
      run: |
        key="${PUBLISH_SECRET_KEY#base64:}"
        if printf '%s' "$key" | grep -q -- '-----BEGIN PGP'; then
          PGP_SECRET="$(printf '%s\n' "$key" | base64 -w0)"
        else
          PGP_SECRET="$key"
        fi
        export PGP_SECRET
        sbt ci-release
      env:
        SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
    # ---- The wasm artifacts (wasm/ build): dapr4s-wasm, dapr4s-wasm-glue(-exports), dapr4s-wasm-scalalib-overlay,
    # dapr4s-wasm-linker, sbt-dapr4s-wasm — at the same version as core, the wall depending on the dapr4s_sjs1_3
    # of THIS version (published locally first so the wasm build resolves it before Central has it).
    # Gated by PUBLISH_WASM_TO_CENTRAL (the wasm build also refuses `publish` unless that variable is 'true',
    # so a local `sbt publish` in wasm/ can never reach Central by accident). See AGENTS.md "Wasm component layer rules".
    - name: Install wasm tools for the wasm publish (wkg, wasm-tools, wit-bindgen-scala)
      if: env.PUBLISH_WASM_TO_CENTRAL == 'true'
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
        rel=https://github.com/bytecodealliance
        curl -fsSL "$rel/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-x86_64-linux.tar.gz" | tar -xz -C /tmp
        mv /tmp/wasm-tools-1.261.0-x86_64-linux/wasm-tools "$bin/"
        curl -fsSL -o "$bin/wkg" "$rel/wasm-pkg-tools/releases/download/v0.16.1/wkg-x86_64-unknown-linux-gnu"
        chmod +x "$bin/wkg"
        cargo install wit-bindgen-scala --version 0.1.0 --locked
    - name: Publish the wasm artifacts
      if: env.PUBLISH_WASM_TO_CENTRAL == 'true'
      run: |
        key="${PUBLISH_SECRET_KEY#base64:}"
        if printf '%s' "$key" | grep -q -- '-----BEGIN PGP'; then
          PGP_SECRET="$(printf '%s\n' "$key" | base64 -w0)"
        else
          PGP_SECRET="$key"
        fi
        export PGP_SECRET
        version="$(sbt -batch -no-colors 'print coreJS/version' | tail -1 | tr -d '[:space:]')"
        sbt coreJS/publishLocal
        cd wasm && sbt -Ddapr4s.wasm.core="$version" ci-release
      env:
        SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
