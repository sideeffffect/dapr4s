name: CI
on:
  push:
    branches: [main, master]
  release:
    types: [ published ]
  pull_request:

# The build is Mill (build.mill, buildsupport.mill). `./mill` is the bootstrap script: it downloads Mill
# 1.3.1, and Mill downloads the JDK it runs on and forks tests with (Zulu 25, `mill-jvm-version` in
# build.mill) through coursier, so no setup-java is needed for the build itself.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - name: Check formatting (scalafmt)
      run: |
        # Files using experimental capture-checking `^{...}` syntax that scalafmt can't parse are
        # listed in .scalafmt.conf project.excludeFilters. If a new such file is added without
        # excluding it, fail loudly here with a pointer to the fix.
        set +e -o pipefail
        ./mill --ticker false mill.scalalib.scalafmt.ScalafmtModule/scalafmt --check 2>&1 | tee fmt.log
        status=$?
        if grep -qiE 'ParseError|illegal start of|error: \[dialect' fmt.log; then
          echo "::error::scalafmt hit a parse error — add the offending file to .scalafmt.conf project.excludeFilters"
          exit 1
        fi
        exit $status

  # One matrix leg per platform. Adding Scala Native one day should be a new include entry
  # (platform: native, ...), not a new job. Each leg: compile, unit tests, integration tests.
  #
  #   core.<p>         the library + its unit tests (core.<p>.test: test/{shared,<p>} minus integration/)
  #   integration.<p>  the Docker-based integration suites (test/{shared,<p>}/integration)
  #
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
          - platform: js
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    # Wasm 3.0 + JSPI are on by default from Node 25; the runner's default Node has neither.
    - name: Set up Node 25
      if: matrix.platform == 'js'
      uses: actions/setup-node@v4
      with:
        node-version: 25
    # The ScalablyTyped facades are generated from node_modules (`npm ci`, run by the build) and
    # compiled by the build (stFacades, several minutes cold). Cache the converter's parse cache and
    # the facade module's Mill output; Mill recomputes anything the restored state does not cover.
    - name: Cache ScalablyTyped facades
      if: matrix.platform == 'js'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          out/stFacades
        key: st-facades-mill-${{ hashFiles('package-lock.json', 'build.mill', 'buildsupport.mill') }}
        restore-keys: st-facades-mill-
    - name: Compile
      run: ./mill --ticker false core.${{ matrix.platform }}.compile + integration.${{ matrix.platform }}.compile
    - name: Unit tests
      run: ./mill --ticker false core.${{ matrix.platform }}.test
    - name: Integration tests
      # A real daprd sidecar (+ Redis, placement, scheduler) via testcontainers; Docker is
      # preinstalled on ubuntu-latest. JVM: testcontainers-dapr. JS: @dapr/testcontainer-node,
      # started from inside the Wasm+JSPI test runtime.
      # Both legs normally finish in a few minutes; the timeout turns a hang into a failure instead of a 6h wait.
      timeout-minutes: 20
      run: ./mill --ticker false integration.${{ matrix.platform }}.testForked

  publish:
    needs: [format, test]
    if: github.event_name != 'pull_request'
    # Serialize publishes that would target the same artifact version. The version is derived from git
    # state at the commit (Dynver in buildsupport.mill), so every publish-triggering event on one commit
    # (master push, tag push, release:published) resolves to the SAME version — and two such runs racing
    # on the Central Portal is what made the v1.0.0 tag-push run 400 ("Publish request failed") while the
    # master-push run for the same commit won. github.sha maps 1:1 to the version.
    # cancel-in-progress: false so an in-flight publish is never interrupted mid-upload; the duplicate waits.
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - name: Cache ScalablyTyped facades
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          out/stFacades
        key: st-facades-mill-${{ hashFiles('package-lock.json', 'build.mill', 'buildsupport.mill') }}
        restore-keys: st-facades-mill-
    # Publishes dapr4s_3 and dapr4s_sjs1_3 (a release tag publishes the clean version to Central, anything
    # else a `-SNAPSHOT` to the Central snapshots repository, as sbt-ci-release did). The secrets keep their
    # scala-cli era names; Mill wants the PGP key base64-encoded, so accept either an ASCII-armored key or
    # an already base64-encoded one.
    - name: Publish (JVM + Scala.js)
      run: |
        set -euo pipefail
        key="${PUBLISH_SECRET_KEY#base64:}"
        if printf '%s' "$key" | grep -q -- '-----BEGIN PGP'; then
          MILL_PGP_SECRET_BASE64="$(printf '%s\n' "$key" | base64 -w0)"
        else
          MILL_PGP_SECRET_BASE64="$key"
        fi
        export MILL_PGP_SECRET_BASE64
        version="$(./mill --ticker false show publishVersion | tail -1 | tr -d '"')"
        echo "Publishing version $version"
        ./mill --ticker false mill.javalib.SonatypeCentralPublishModule/publishAll \
          --publishArtifacts '{core.jvm,core.js}.publishArtifacts'
      env:
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
