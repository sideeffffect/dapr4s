name: CI
on:
  push:
    branches: [main, master]
  release:
    types: [ published ]
  pull_request:

# The build is Mill (build.mill, wasm/package.mill). `./mill` is the bootstrap script: it runs the
# unreleased Mill that scripts/upstream-snapshot.sh installs (see the first steps of every job), and Mill
# downloads the JDK it runs on and forks tests with (Zulu 25, `mill-jvm-version` in build.mill) through
# coursier, so no setup-java is needed for the build itself.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    # Mill (main + https://github.com/com-lihaoyi/mill/pull/7783) and mill-scalablytyped
    # (main, which has https://github.com/lolgab/mill-scalablytyped/pull/50, + /51 + /52) are unreleased: build them from the
    # commits pinned in scripts/upstream-snapshot.sh and install them locally, cached by that file's hash.
    - name: Cache the upstream Mill + mill-scalablytyped snapshots
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill/download
          ~/.ivy2/local/com.lihaoyi
          ~/.ivy2/local/com.github.lolgab
        key: upstream-snapshot-${{ hashFiles('scripts/upstream-snapshot.sh') }}
    - name: Build the upstream Mill + mill-scalablytyped snapshots
      run: scripts/upstream-snapshot.sh
    - name: Check formatting (scalafmt)
      run: |
        # Files using experimental capture-checking `^{...}` syntax that scalafmt can't parse are
        # listed in .scalafmt.conf project.excludeFilters. If a new such file is added without
        # excluding it, fail loudly here with a pointer to the fix.
        set +e -o pipefail
        ./mill --ticker false mill.scalalib.scalafmt.ScalafmtModule/scalafmt --check 2>&1 | tee fmt.log
        status=$?
        if grep -qiE 'ParseError|illegal start of|error: \[dialect' fmt.log; then
          echo "::error::scalafmt hit a parse error — add the offending file to .scalafmt.conf project.excludeFilters"
          exit 1
        fi
        exit $status

  # One matrix leg per platform. Adding Scala Native one day should be a new include entry
  # (platform: native, ...), not a new job. Each leg: compile, unit tests, integration tests.
  #
  #   core.<p>         the library + its unit tests (core.<p>.test: test/{shared,<p>} minus integration/)
  #   integration.<p>  the Docker-based integration suites (test/{shared,<p>}/integration)
  #
  # The `wasm` leg builds the WASI-component platform (wasm/package.mill, docs/WASM-COMPONENTS-PROPOSAL.md
  # §6): the wall's unit tests (on Node) and scripts/wasm/e2e.sh in both core modes, then a fresh Mill and a
  # fresh sbt consumer build with the published-to-a-local-repo artifacts (scripts/wasm/consumer-check-mill.sh,
  # scripts/wasm/consumer-check.sh).
  #
  # The wasm leg GATES `publish`, like jvm and js: the publish job also publishes the seven wasm
  # artifacts to Central (PUBLISH_WASM_TO_CENTRAL), so a broken wasm build must never reach a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
          - platform: js
          - platform: wasm
    name: test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    # Mill (main + https://github.com/com-lihaoyi/mill/pull/7783) and mill-scalablytyped
    # (main, which has https://github.com/lolgab/mill-scalablytyped/pull/50, + /51 + /52) are unreleased: build them from the
    # commits pinned in scripts/upstream-snapshot.sh and install them locally, cached by that file's hash.
    - name: Cache the upstream Mill + mill-scalablytyped snapshots
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill/download
          ~/.ivy2/local/com.lihaoyi
          ~/.ivy2/local/com.github.lolgab
        key: upstream-snapshot-${{ hashFiles('scripts/upstream-snapshot.sh') }}
    - name: Build the upstream Mill + mill-scalablytyped snapshots
      run: scripts/upstream-snapshot.sh
    # Wasm 3.0 + JSPI are on by default from Node 25; the runner's default Node has neither.
    - name: Set up Node 25
      if: matrix.platform == 'js'
      uses: actions/setup-node@v4
      with:
        node-version: 25
    # The ScalablyTyped facades are generated from node_modules (`npm ci`, run by the build) and
    # compiled by the build (stFacades, several minutes cold). Cache the converter's parse cache and
    # the facade module's Mill output; Mill recomputes anything the restored state does not cover.
    - name: Cache ScalablyTyped facades
      if: matrix.platform == 'js'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          out/stFacades
        key: st-facades-mill-${{ hashFiles('package-lock.json', 'build.mill', 'buildsupport.mill', 'scripts/upstream-snapshot.sh') }}
        restore-keys: st-facades-mill-
    - name: Compile
      if: matrix.platform != 'wasm'
      run: ./mill --ticker false core.${{ matrix.platform }}.compile + integration.${{ matrix.platform }}.compile
    - name: Unit tests
      if: matrix.platform != 'wasm'
      run: ./mill --ticker false core.${{ matrix.platform }}.test
    - name: Integration tests
      if: matrix.platform != 'wasm'
      # A real daprd sidecar (+ Redis, placement, scheduler) via testcontainers; Docker is
      # preinstalled on ubuntu-latest. JVM: testcontainers-dapr. JS: @dapr/testcontainer-node,
      # started from inside the Wasm+JSPI test runtime.
      # Both legs normally finish in a few minutes; the timeout turns a hang into a failure instead of a 6h wait.
      timeout-minutes: 20
      run: ./mill --ticker false integration.${{ matrix.platform }}.testForked

    # ---- wasm leg ------------------------------------------------------------------------------
    # Tool versions are the ones the Phase-0 spike used (wiki: scala-wasm-component-spike).
    - name: Install wasm tools (wasm-tools, wasmtime, wkg, wac)
      if: matrix.platform == 'wasm'
      env:
        WASM_TOOLS_VERSION: 1.261.0
        WASMTIME_VERSION: 49.0.2
        WKG_VERSION: 0.16.1
        WAC_VERSION: 0.10.0
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
        rel=https://github.com/bytecodealliance
        curl -fsSL "$rel/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
          | tar -xz -C /tmp
        mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$bin/"
        curl -fsSL "$rel/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
          | tar -xJ -C /tmp
        mv "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$bin/"
        curl -fsSL -o "$bin/wkg" "$rel/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu"
        curl -fsSL -o "$bin/wac" "$rel/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"
        chmod +x "$bin/wkg" "$bin/wac"
        "$bin/wasm-tools" --version; "$bin/wasmtime" --version; "$bin/wkg" --version; "$bin/wac" --version
    # The build runs `wit-bindgen-scala` (crate 0.1.0) to generate the WIT bindings.
    - name: Cache wit-bindgen-scala
      if: matrix.platform == 'wasm'
      id: cache-wbs
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wit-bindgen-scala
        key: wit-bindgen-scala-0.1.0-${{ runner.os }}
    - name: Install wit-bindgen-scala
      if: matrix.platform == 'wasm' && steps.cache-wbs.outputs.cache-hit != 'true'
      run: cargo install wit-bindgen-scala --version 0.1.0 --locked
    - name: Install the dapr CLI and daprd (slim, no placement/scheduler)
      if: matrix.platform == 'wasm'
      run: |
        wget -q https://raw.githubusercontent.com/dapr/cli/v1.15.1/install/install.sh -O - | /bin/bash -s 1.15.1
        dapr init --slim --runtime-version 1.17.7
        echo "$HOME/.dapr/bin" >> "$GITHUB_PATH"
    # The patched scala-wasm linker is compiled by the `wasm.linker` module from the release commit's
    # sources + our patch (scripts/wasm/prepare-patched-linker.sh); cache the scala-wasm clone.
    - name: Cache the scala-wasm clone
      if: matrix.platform == 'wasm'
      uses: actions/cache@v4
      with:
        path: ~/.cache/dapr4s/scala-wasm-src
        key: scala-wasm-src-${{ hashFiles('scripts/wasm/prepare-patched-linker.sh') }}
        restore-keys: scala-wasm-src-
    # Source mode: the wall over dapr4s's own src/shared (covers shared-code changes), unit tests + e2e
    # (counter-raw, counter, imports-probe against daprd + Redis).
    - name: Wall unit tests (source + release mode)
      if: matrix.platform == 'wasm'
      run: ./mill --ticker false 'wasm.lib[source].wall.test' + 'wasm.lib[release].wall.test'
    - name: E2E, source mode (components + compose + daprd + Redis)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: WASM_CORE=source scripts/wasm/e2e.sh
    - name: E2E, release mode (the wall on the published dapr4s_sjs1_3)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: WASM_CORE=release scripts/wasm/e2e.sh
    # mill-dapr4s-wasm is a product for Mill consumers (dapr4s-examples): check it the way they use it, with
    # a fresh Mill build whose header loads the plugin from the local repo.
    - name: Consumer check, Mill (plugin + one dependency, e2e)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: scripts/wasm/consumer-check-mill.sh
    # sbt-dapr4s-wasm is a product for sbt consumers: check it the way they use it, with a fresh sbt build
    # (the only sbt in CI; dapr4s's own build is Mill).
    - uses: actions/setup-java@v5
      if: matrix.platform == 'wasm'
      with:
        distribution: zulu
        java-version: 25
    - uses: sbt/setup-sbt@v1
      if: matrix.platform == 'wasm'
    - name: Consumer check (sbt plugin + one dependency, e2e)
      if: matrix.platform == 'wasm'
      timeout-minutes: 20
      run: scripts/wasm/consumer-check.sh

  publish:
    needs: [format, test]
    if: github.event_name != 'pull_request'
    # Serialize publishes that would target the same artifact version. The version is derived from git
    # state at the commit (Dynver in buildsupport.mill), so every publish-triggering event on one commit
    # (master push, tag push, release:published) resolves to the SAME version — and two such runs racing
    # on the Central Portal is what made the v1.0.0 tag-push run 400 ("Publish request failed") while the
    # master-push run for the same commit won. github.sha maps 1:1 to the version.
    # cancel-in-progress: false so an in-flight publish is never interrupted mid-upload; the duplicate waits.
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # The switch for Central publishing of the wasm artifacts (ON since 2026-10-13, approved by the
      # user). Setting it to 'false' stops only the wasm artifacts; core (dapr4s_3, dapr4s_sjs1_3)
      # publishes regardless.
      PUBLISH_WASM_TO_CENTRAL: 'true'
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    # Mill (main + https://github.com/com-lihaoyi/mill/pull/7783) and mill-scalablytyped
    # (main, which has https://github.com/lolgab/mill-scalablytyped/pull/50, + /51 + /52) are unreleased: build them from the
    # commits pinned in scripts/upstream-snapshot.sh and install them locally, cached by that file's hash.
    - name: Cache the upstream Mill + mill-scalablytyped snapshots
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill/download
          ~/.ivy2/local/com.lihaoyi
          ~/.ivy2/local/com.github.lolgab
        key: upstream-snapshot-${{ hashFiles('scripts/upstream-snapshot.sh') }}
    - name: Build the upstream Mill + mill-scalablytyped snapshots
      run: scripts/upstream-snapshot.sh
    - name: Cache ScalablyTyped facades
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scalablytyped
          out/stFacades
        key: st-facades-mill-${{ hashFiles('package-lock.json', 'build.mill', 'buildsupport.mill', 'scripts/upstream-snapshot.sh') }}
        restore-keys: st-facades-mill-
    - name: Install wasm tools for the wasm publish (wkg, wasm-tools, wit-bindgen-scala)
      if: env.PUBLISH_WASM_TO_CENTRAL == 'true'
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
        rel=https://github.com/bytecodealliance
        curl -fsSL "$rel/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-x86_64-linux.tar.gz" | tar -xz -C /tmp
        mv /tmp/wasm-tools-1.261.0-x86_64-linux/wasm-tools "$bin/"
        curl -fsSL -o "$bin/wkg" "$rel/wasm-pkg-tools/releases/download/v0.16.1/wkg-x86_64-unknown-linux-gnu"
        chmod +x "$bin/wkg"
        cargo install wit-bindgen-scala --version 0.1.0 --locked
    # Publishes dapr4s_3 and dapr4s_sjs1_3 (a release tag publishes the clean version to Central, anything
    # else a `-SNAPSHOT` to the Central snapshots repository) and, with PUBLISH_WASM_TO_CENTRAL, the seven
    # wasm artifacts (incl. the two build plugins) at the SAME version: dapr4s-wasm's release mode depends on the dapr4s_sjs1_3 of THIS
    # version (DAPR4S_WASM_CORE_VERSION), published locally first so the build resolves it before Central
    # has it. The secrets keep their scala-cli era names; Mill wants the PGP key base64-encoded, so accept
    # either an ASCII-armored key or an already base64-encoded one.
    - name: Publish
      run: |
        set -euo pipefail
        key="${PUBLISH_SECRET_KEY#base64:}"
        if printf '%s' "$key" | grep -q -- '-----BEGIN PGP'; then
          MILL_PGP_SECRET_BASE64="$(printf '%s\n' "$key" | base64 -w0)"
        else
          MILL_PGP_SECRET_BASE64="$key"
        fi
        export MILL_PGP_SECRET_BASE64
        version="$(./mill --ticker false show publishVersion | tail -1 | tr -d '"')"
        echo "Publishing version $version"
        artifacts='{core.jvm,core.js}.publishArtifacts'
        if [[ "$PUBLISH_WASM_TO_CENTRAL" == true ]]; then
          ./mill --ticker false core.js.publishLocal
          export DAPR4S_WASM_CORE_VERSION="$version"
          artifacts='{core.jvm,core.js,wasm.lib[release].wall,wasm.glue,wasm.glueExports,wasm.scalalibOverlay,wasm.linker[_],wasm.millPlugin,wasm.sbtPlugin}.publishArtifacts'
        fi
        ./mill --ticker false mill.javalib.SonatypeCentralPublishModule/publishAll --publishArtifacts "$artifacts"
      env:
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        PUBLISH_SECRET_KEY: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
