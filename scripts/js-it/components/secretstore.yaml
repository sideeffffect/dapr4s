apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    # Path as seen INSIDE the daprd container: scripts/js-it/ is mounted at /dapr4s-js-it
    # (see scripts/js-integration-env.sh).
    - name: secretsFile
      value: /dapr4s-js-it/secrets.json
