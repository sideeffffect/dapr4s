apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    # Path as seen INSIDE the daprd container: the shared secrets.json is mounted at
    # /dapr4s-it/secrets.json by both harnesses.
    - name: secretsFile
      value: /dapr4s-it/secrets.json
    - name: nestedSeparator
      value: ":"
