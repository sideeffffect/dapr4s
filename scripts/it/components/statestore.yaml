apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    # ${DAPR4S_IT_REDIS_HOST} is substituted by scripts/it/render-components.sh: the JVM
    # testcontainers topology renders "redis:6379" (shared Docker network, alias "redis"),
    # the JS host-network topology renders "localhost:6391" (see scripts/js-integration-env.sh).
    - name: redisHost
      value: ${DAPR4S_IT_REDIS_HOST}
    - name: redisPassword
      value: ""
    # The Counter actor and the workflow runtime both store their state here.
    - name: actorStateStore
      value: "true"
