apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        dapr.io/enabled:   "true"
        dapr.io/app-id:    "order-service"
        dapr.io/app-port:  "8080"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: order-service
          image: order-service:dev
          imagePullPolicy: Never     # loaded via k3d image import
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /dapr/subscribe
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
