version = "3.10.4"
runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.significant = 2

trailingCommas = always

# Files using experimental capture-checking `^{this}` return-type annotations
# are excluded until scalafmt gains nightly-Scala CC syntax support.
project.excludeFilters = [
  "src/Capabilities\\.scala",
  "src/DaprCapability\\.scala",
  "src/Workflows\\.scala",
  "src/internal/ConfigCapabilityImpl\\.scala",
  "src/internal/DaprCapabilityImpl\\.scala",
  "src/internal/WorkflowContextImpl\\.scala",
  "test/unit/MockDaprScope\\.scala"
]
