version = "3.10.4"
runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.significant = 2

trailingCommas = always

# DaprCapability.scala uses experimental capture-checking `^{this}` return-type
# annotations that scalafmt's parser does not yet support. Exclude it until
# scalafmt gains nightly-Scala CC syntax support.
project.excludeFilters = [
  "src/DaprCapability\\.scala"
]
